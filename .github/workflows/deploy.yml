name: Deploy frontend to VPS

# Auto-deploys aflachat.co.tz (Next.js) to the production VPS on every push
# to a deploy branch. Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.

on:
  push:
    branches: [master, feature/chat-widget]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /root/aflachat-web
            echo "==> sync ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git checkout -f ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            echo "==> install deps"
            npm ci --no-audit --no-fund
            echo "==> build"
            NODE_OPTIONS='--max-old-space-size=768' npm run build
            echo "==> restart service"
            systemctl restart aflachat-web
            sleep 5
            systemctl is-active aflachat-web
            curl -fsS -o /dev/null -w 'frontend HTTP %{http_code}\n' http://127.0.0.1:3100/
