name: Deploy
on:
  push:
    branches: [feature/chat-widget]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: bash /root/deploy-web.sh feature/chat-widget
